<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>A QR Is Born</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 75vw;
      max-height: 100vh;
      max-width: 133.33vh;
      image-rendering: pixelated;
      outline: none;
    }
    #btn {
      position: absolute;
      z-index: 10;
      padding: 18px 32px;
      font: bold 18px monospace;
      background: #6c5eb5;
      color: #fff;
      border: 3px solid #a599e9;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <button id="btn">TAP TO RUN C64 DEMO</button>
  <canvas id="canvas" width="768" height="544" tabindex="0"></canvas>

  <script>
    const btn = document.getElementById('btn');
    const canvas = document.getElementById('canvas');
    const b64 = window.location.hash.slice(1).trim();

    if (!b64) {
      btn.textContent = 'NO #BASE64 PAYLOAD IN URL';
      btn.disabled = true;
    }

    function sendKey(key, code, keyCode) {
      const opts = { key, code, keyCode, which: keyCode, bubbles: true };
      canvas.dispatchEvent(new KeyboardEvent('keydown', opts));
      window.dispatchEvent(new KeyboardEvent('keydown', opts));
      setTimeout(() => {
        canvas.dispatchEvent(new KeyboardEvent('keyup', opts));
        window.dispatchEvent(new KeyboardEvent('keyup', opts));
      }, 60);
    }

    btn.onclick = () => {
      btn.remove();
      canvas.focus();

      // 1. Decode Base64 to raw .prg bytes
      const cleanB64 = b64.replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(cleanB64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      // 2. Intercept XHR for 'demo.prg' so tiny8bit sees a clean .prg filename
      const origOpen = XMLHttpRequest.prototype.open;
      const origSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function(method, url) {
        this._isDemoPrg = typeof url === 'string' && url.endsWith('demo.prg');
        return origOpen.apply(this, arguments);
      };
      XMLHttpRequest.prototype.send = function() {
        if (this._isDemoPrg) {
          Object.defineProperty(this, 'status', { value: 200 });
          Object.defineProperty(this, 'readyState', { value: 4 });
          Object.defineProperty(this, 'response', { value: bytes.buffer });
          if (this.onload) this.onload();
          if (this.onreadystatechange) this.onreadystatechange();
          return;
        }
        return origSend.apply(this, arguments);
      };

      // 3. Boot tiny8bit WASM C64 core with a clean 'file=demo.prg' argument
      window.Module = {
        canvas: canvas,
        locateFile: (p) => 'https://github.io' + p,
        arguments: ['file=demo.prg']
      };

      const script = document.createElement('script');
      script.src = 'https://github.ioc64.js';
      document.body.appendChild(script);

      // 4. Auto-type RUN + Enter after boot (just in case tiny8bit only loads into RAM)
      setTimeout(() => sendKey('r', 'KeyR', 82), 2600);
      setTimeout(() => sendKey('u', 'KeyU', 85), 2750);
      setTimeout(() => sendKey('n', 'KeyN', 78), 2900);
      setTimeout(() => sendKey('Enter', 'Enter', 13), 3050);
    };
  </script>
</body>
</html>
