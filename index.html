<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>A QR Is Born</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 75vw;
      max-height: 100vh;
      max-width: 133.33vh;
      image-rendering: pixelated;
      outline: none;
    }
    #btn {
      position: absolute;
      z-index: 10;
      padding: 18px 32px;
      font: bold 18px monospace;
      background: #6c5eb5;
      color: #fff;
      border: 3px solid #a599e9;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    #status {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 12px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <button id="btn">TAP TO RUN C64 DEMO</button>
  <canvas id="canvas" width="768" height="544" tabindex="0"></canvas>
  <div id="status"></div>

  <script>
    const btn = document.getElementById('btn');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const b64 = window.location.hash.slice(1).trim();

    // Read ?sid=8580 or ?sid=6581 from the URL (defaults to 6581 if omitted)
    const urlParams = new URLSearchParams(window.location.search);
    const sidModel = urlParams.get('sid') || '6581';

    if (!b64) {
      btn.textContent = 'NO #BASE64 PAYLOAD IN URL';
      btn.disabled = true;
    }

    btn.onclick = () => {
      btn.remove();
      canvas.focus();

      // 1. Decode URL-safe or standard Base64 into raw .prg bytes
      const cleanB64 = b64.replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(cleanB64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      // 2. If ?sid=8580 is specified, shape WebAudio output to compensate for 6581's darker filter
      if (sidModel === '8580') {
        const OrigAudioCtx = window.AudioContext || window.webkitAudioContext;
        if (OrigAudioCtx) {
          const origConnect = AudioNode.prototype.connect;
          AudioNode.prototype.connect = function(dest) {
            if (dest && dest.context && dest === dest.context.destination && !this._sid8580Shaped) {
              this._sid8580Shaped = true;
              const ctx = dest.context;
              const shelf = ctx.createBiquadFilter();
              shelf.type = 'highshelf';
              shelf.frequency.value = 1400;
              shelf.gain.value = 7.5;
              const gain = ctx.createGain();
              gain.gain.value = 1.35;
              origConnect.call(this, shelf);
              origConnect.call(shelf, gain);
              return origConnect.call(gain, dest);
            }
            return origConnect.apply(this, arguments);
          };
        }
      }

      // 3. Preserve ?sid=... alongside ?file=demo.prg in window.location.search
      const nextParams = new URLSearchParams(window.location.search);
      nextParams.set('file', 'demo.prg');
      if (urlParams.has('sid')) nextParams.set('sid', sidModel);
      history.replaceState(null, '', '?' + nextParams.toString() + window.location.hash);

      // 4. Intercept fetch() so tiny8bit gets the in-memory .prg bytes
      const origFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        if (url.includes('demo.prg')) {
          status.textContent = `Loaded demo.prg (${bytes.length}B · SID ${sidModel})`;
          setTimeout(() => status.remove(), 2500);
          return Promise.resolve(new Response(bytes, {
            status: 200,
            headers: { 'Content-Type': 'application/octet-stream' }
          }));
        }
        return origFetch(input, init);
      };

      // 5. Boot tiny8bit WASM C64 core (using join('/') to prevent URL mangling)
      const base = ['https:/', 'floooh.github.io', 'tiny8bit', ''].join('/');
      window.Module = {
        canvas: canvas,
        locateFile: (p) => base + p
      };

      const script = document.createElement('script');
      script.src = base + 'c64.js';
      script.onerror = () => { status.textContent = 'Failed to load c64.js'; };
      document.body.appendChild(script);
    };
  </script>
</body>
</html>
