<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>A QR Is Born</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 75vw;
      max-height: 100vh;
      max-width: 133.33vh;
      image-rendering: pixelated;
      outline: none;
    }
    #btn {
      position: absolute;
      z-index: 10;
      padding: 18px 32px;
      font: bold 18px monospace;
      background: #6c5eb5;
      color: #fff;
      border: 3px solid #a599e9;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <button id="btn">TAP TO RUN C64 DEMO</button>
  <canvas id="canvas" width="768" height="544" tabindex="0"></canvas>

  <script>
    const btn = document.getElementById('btn');
    const canvas = document.getElementById('canvas');
    const b64 = window.location.hash.slice(1).trim();

    if (!b64) {
      btn.textContent = 'NO #BASE64 PAYLOAD IN URL';
      btn.disabled = true;
    }

    btn.onclick = () => {
      btn.remove();
      canvas.focus();

      // 1. Decode URL-safe or standard Base64 into raw .prg bytes
      const cleanB64 = b64.replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(cleanB64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      // 2. Create a local Blob URL so tiny8bit's XHR loader can fetch it directly
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const prgUrl = URL.createObjectURL(blob);

      // 3. Boot tiny8bit WASM C64 core with explicit canvas dimensions & file=blob:...
      window.Module = {
        canvas: canvas,
        locateFile: (p) => 'https://floooh.github.io/tiny8bit/' + p,
        arguments: ['file=' + prgUrl]
      };

      const script = document.createElement('script');
      script.src = 'https://floooh.github.io/tiny8bit/c64.js';
      document.body.appendChild(script);
    };
  </script>
</body>
</html>
